[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "propensity-score-matcher"
version = "1.0.0"
description = "Propensity score matching for clinical and biomedical research"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Propensity Score Matcher Contributors"}
]
keywords = ["propensity-score", "matching", "clinical", "biomedical", "statistics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
test = ["pytest>=7.0"]

[project.scripts]
ps-matcher = "cli:main"

[tool.setuptools]
packages = ["agents"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_ps_matcher.py"]
python_files = ["test_*.py"]
